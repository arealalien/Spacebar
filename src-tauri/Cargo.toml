[package]
name = "spacebar"
version = "1.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
gif = { version = "0.14", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
png = "0.17"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = { version = "~2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
windows-collections = "0.2"
windows-core = "0.61"
windows-numerics = "0.2"
windows = { version = "0.61", features = ["Foundation", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Media_Control", "System", "UI_Composition_Desktop", "Win32_Media_Audio_Endpoints", "Storage_Streams", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT_Composition", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
